apiVersion: apps/v1
kind: Deployment
metadata:
  name: ado-agent
  namespace: ado-agents
  labels:
    app: ado-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ado-agent
  template:
    metadata:
      labels:
        app: ado-agent
    spec:
      containers:
        - name: ado-agent
          image: acrshopnowprod3aez.azurecr.io/ado-agent:latest
          env:
            - name: AZP_URL
              valueFrom:
                secretKeyRef:
                  name: ado-agent-secret
                  key: AZP_URL
            - name: AZP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ado-agent-secret
                  key: AZP_TOKEN
            - name: AZP_POOL
              valueFrom:
                secretKeyRef:
                  name: ado-agent-secret
                  key: AZP_POOL
            - name: AZP_AGENT_NAME
              value: "shopnow-aks-agent"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          volumeMounts:
            - name: agent-work
              mountPath: /azp/_work
      volumes:
        - name: agent-work
          emptyDir: {}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000